# Config with an MCP server attached.
#
# The `demo-tools` server (mcp/demo_server.py) exposes `word_count` and `shout`,
# which appear to the model as `demo-tools__word_count` and `demo-tools__shout`.
context_window = 128000
context_strategy = "T4"
planning_enabled = false
action_space = "predefined"
max_turns = 12
timeout_secs = 180

[model]
provider = "kenari"
model_id = "deepseek-v4-1-flash"
api_base = "https://kenari.id/v1"
api_key_env = "KENARI_API_KEY"
temperature = 0.0
max_tokens = 1024
timeout_secs = 60
max_retries = 2

[[mcp]]
name = "demo-tools"
type = "stdio"
command = "python"
args = ["mcp/demo_server.py"]
