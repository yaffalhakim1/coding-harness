# Config for the Kenari gateway (OpenAI-compatible).
# Used by the live end-to-end test; override the model with AXOLOTL_TEST_MODEL.
context_window = 128000
context_strategy = "T4"
planning_enabled = true
action_space = "predefined"
max_turns = 20
timeout_secs = 300

[thresholds]
soft_ratio = 0.6
hard_ratio = 0.85
recent_ratio = 0.3
recent_turns = 2

[model]
provider = "kenari"
model_id = "deepseek-v4-1-flash"
api_base = "https://kenari.id/v1"
api_key_env = "KENARI_API_KEY"
temperature = 0.0
max_tokens = 4096
timeout_secs = 120
max_retries = 3
