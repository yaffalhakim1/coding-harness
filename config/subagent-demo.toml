# Config with subagents enabled.
#
# The agent gets a `task` tool: it can delegate a bounded investigation to a
# child run that has its own context window and returns only a final answer.
context_window = 128000
context_strategy = "T4"
planning_enabled = false
action_space = "predefined"
max_turns = 15
timeout_secs = 240
subagents = true

[model]
provider = "kenari"
model_id = "deepseek-v4-1-flash"
api_base = "https://kenari.id/v1"
api_key_env = "KENARI_API_KEY"
temperature = 0.0
max_tokens = 1024
timeout_secs = 90
max_retries = 2
