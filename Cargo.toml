[workspace]
resolver = "2"
members = [
    "crates/axolotl-core",
    "crates/axolotl-context",
    "crates/axolotl-planning",
    "crates/axolotl-actions",
    "crates/axolotl-models",
    "crates/axolotl-bench",
    "crates/axolotl-tui",
    "crates/axolotl-acp",
    "crates/axolotl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["yaffalhakim1"]
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP & API
reqwest = { version = "0.11", features = ["json", "stream"] }
url = "2.5"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tiktoken-rs = "0.5"
tempfile = "3.9"
walkdir = "2.4"
regex = "1.10"
sha2 = "0.10"
rand = "0.8"
globset = "0.4"

# Workspace crates
axolotl-core = { path = "crates/axolotl-core" }
axolotl-context = { path = "crates/axolotl-context" }
axolotl-planning = { path = "crates/axolotl-planning" }
axolotl-actions = { path = "crates/axolotl-actions" }
axolotl-models = { path = "crates/axolotl-models" }
axolotl-bench = { path = "crates/axolotl-bench" }

[profile.release]
opt-level = 3
lto = true
